<!-- 
  Sidebar estático para la vista de escritorio.
  Se usa 'flex-shrink-0' para asegurar que mantenga su ancho de w-64
  y no sea colapsado por el contenido principal.
-->
<aside class="w-64 flex-shrink-0 bg-slate-900 text-slate-300 flex flex-col p-4 h-screen">
  
  <!-- 🚀 Logo/Título (AHORA VERTICAL) -->
  <a routerLink="/dashboard" class="flex flex-col items-center space-y-4 px-2 py-4 border-b border-slate-700 flex-shrink-0">
    
    <!-- 🚀 Imagen grande, redonda, y con el fondo "transparente" -->
    <img 
      src="/conexionuLOGO.png" 
      alt="Logo Conexión U" 
      class="h-40 w-40 rounded-full object-cover mix-blend-lighten"> 
    
    <!-- 🚀 Texto movido DENTRO del enlace y abajo -->
    <span class="text-white text-2xl font-semibold">Conexión U</span>
  </a>

  <!-- Navegación (con overflow por si crece) -->
  <nav class="mt-6 flex-1 overflow-y-auto">
    <a routerLink="/dashboard/estudiantes" routerLinkActive="bg-slate-800 text-white"
       class="flex items-center space-x-3 rounded-lg px-3 py-2.5 transition-colors duration-200 hover:bg-slate-800 hover:text-white">
      <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
      </svg>
      <span class="font-medium">Estudiantes</span>
    </a>
    
    <a routerLink="/dashboard/catalogos" routerLinkActive="bg-slate-800 text-white"
       class="flex items-center space-x-3 rounded-lg px-3 py-2.5 mt-2 transition-colors duration-200 hover:bg-slate-800 hover:text-white">
      <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
      </svg>
      <span class="font-medium">Catálogos</span>
    </a>
    
    <!-- Puedes añadir más enlaces aquí si los necesitas -->

  </nav>

  <!-- Cerrar Sesión -->
  <div class="mt-auto flex-shrink-0">
    <button (click)="onLogout.emit()" 
            class="flex items-center space-x-3 text-red-400 hover:text-red-300 rounded-lg px-3 py-2.5 transition-colors duration-200 w-full">
      <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
      </svg>
      <span class="font-medium">Cerrar sesión</span>
    </button>
  </div>
</aside>
