<!-- Contenedor principal: Fondo de pantalla completo con un color muy suave y centrado -->
<div class="flex min-h-screen items-center justify-center bg-gray-50 dark:bg-gray-950 p-4">
  <!-- Tarjeta de Login: Diseño limpio, profesional y responsivo -->
  <div class="bg-white dark:bg-gray-800 p-8 sm:p-10 rounded-2xl shadow-xl w-full max-w-sm transition-shadow duration-300">

    <!-- Encabezado y Logo Placeholder -->
    <div class="text-center mb-8">
      <!-- Icono/Logo Placeholder (Diseño sutil y corporativo con un candado SVG) -->
      <div class="mx-auto w-10 h-10 bg-indigo-600 rounded-lg mb-4 flex items-center justify-center">
        <!-- Candado (ícono común en logins) -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v3h8z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
        Iniciar Sesión
      </h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
        Accede a tu cuenta de usuario
      </p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Campo Correo -->
      <div>
        <label for="correo" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Correo electrónico
        </label>
        <input
          id="correo"
          type="email"
          [(ngModel)]="correo"
          name="correo"
          placeholder="nombre@ejemplo.com"
          class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-4 py-2 text-base placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 outline-none"
        />
      </div>

      <!-- Campo Contraseña -->
      <div>
        <label for="contrasena" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Contraseña
        </label>
        <input
          id="contrasena"
          type="password"
          [(ngModel)]="contrasena"
          name="contrasena"
          placeholder="••••••••"
          class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-4 py-2 text-base placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 outline-none"
        />
      </div>

      <!-- Mensaje de Error -->
      <p *ngIf="error" class="text-red-500 text-sm text-center bg-red-100 dark:bg-red-900/30 p-2 rounded-lg border border-red-300 dark:border-red-700">
        {{ error }}
      </p>

      <!-- Botón de Ingreso con indicador de carga profesional -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg disabled:bg-indigo-400 disabled:shadow-none disabled:cursor-not-allowed text-base"
      >
        <span *ngIf="!loading">Ingresar</span>
        <span *ngIf="loading" class="flex items-center justify-center">
          <!-- Spinner de carga -->
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Ingresando...
        </span>
      </button>

      <!-- Opciones adicionales -->
      <div class="text-center pt-2">
        <a href="#" class="text-sm font-medium text-gray-500 hover:text-indigo-600 dark:text-gray-400 dark:hover:text-indigo-400 transition-colors">
          ¿Necesitas ayuda para iniciar sesión?
        </a>
      </div>
    </form>
  </div>
</div>
